#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "unifi"
name = "UniFi Network"
description.en = "Self-hosted UniFi Network controller to manage Ubiquiti devices"
description.fr = "Contrôleur réseau UniFi auto-hébergé pour gérer les équipements Ubiquiti"

version = "8.6.9~ynh2"

maintainers = ["Mistermasque"]

[upstream]
license = "proprietary"
website = "https://ui.com/download/releases/network-server"
admindoc = "https://help.ui.com/hc/en-us/articles/220066768"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = "not_relevant"
disk = "20G"
ram.build = "100M"
ram.runtime = "2G"

[install]

    [install.domain]
    # UniFi cannot be installed at a sub-path — it needs its own domain.
    # The path question is intentionally omitted: YunoHost will default
    # to "/" and the nginx template is written for root-only installs.
    type = "domain"

    [install.init_main_permission]
    # init_main_permission matches the permission named "main" in
    # [resources.permissions] below (init_{NAME}_permission convention).
    # UniFi manages its own authentication — default to "admins" so the
    # nginx vhost is served but no SSO layer is inserted.
    type = "group"
    default = "admins"

    [install.guest_portal]
    ask.en = "Enable guest portal feature?"
    ask.fr = "Activer la fonctionnalité de portail invité ?"
    help.en = "Opens TCP 8880 (HTTP redirect) and TCP 8843 (HTTPS redirect) in the firewall. Required if you use UniFi's captive guest portal on your access points."
    help.fr = "Ouvre les ports TCP 8880 (redirection HTTP) et TCP 8843 (redirection HTTPS) dans le pare-feu. Nécessaire si vous utilisez le portail captif invité sur vos points d'accès."
    type = "boolean"
    default = false

    [install.speed_test]
    ask.en = "Enable mobile speed test feature?"
    ask.fr = "Activer la fonctionnalité de test de vitesse mobile ?"
    help.en = "Opens TCP 6789 in the firewall. Required if you want to run speed tests from the UniFi mobile app."
    help.fr = "Ouvre le port TCP 6789 dans le pare-feu. Nécessaire si vous souhaitez effectuer des tests de vitesse depuis l'application mobile UniFi."
    type = "boolean"
    default = false

[resources]

    # ------------------------------------------------------------------
    # [resources.apt]
    #
    # YunoHost provisions resources in this order:
    #   ports → permissions → apt
    #
    # Port 8443 is therefore booked BEFORE apt installs unifi. However,
    # the unifi package's post-install script starts the service which
    # then binds 8443. YunoHost detects the port is held by an unexpected
    # process and raises a conflict error.
    #
    # The fix lives in the install script: it stops the auto-started
    # service immediately as its very first action (before touching nginx
    # or firewall), then re-starts it cleanly at the end. At that point
    # the port is already registered to this app so no conflict is raised.
    #
    # Yunohost resource provisionning for packages are inhibited cause
    # of specific installation on raspberry which needs to download directly some packages
    # ------------------------------------------------------------------
    # [resources.apt]
    # packages = [
    #     "alsa-topology-conf", "alsa-ucm-conf", "fonts-dejavu-extra",
    #     "java-common", "libasound2", "libasound2-data", "libxi6",
    #     "libxrender1", "libxtst6", "p11-kit", "p11-kit-modules", "x11-common"
    # ]

    # extras.adoptium.repo     = "deb https://packages.adoptium.net/artifactory/deb bookworm main"
    # extras.adoptium.key      = "https://packages.adoptium.net/artifactory/api/gpg/key/public"
    # extras.adoptium.packages = ["adoptium-ca-certificates", "temurin-25-jre"]

    # MongoDB 8.0 — amd64
    # Official Debian bookworm repo, pinned to amd64 only.
    # extras.mongodb-amd64.repo     = "deb [ arch=amd64 ] https://repo.mongodb.org/apt/debian bookworm/mongodb-org/8.0 main"
    # extras.mongodb-amd64.key      = "https://pgp.mongodb.com/server-8.0.asc"
    # extras.mongodb-amd64.packages = ["mongodb-org-server"]

    # MongoDB 8.0 — arm64 (Raspberry Pi 4 and other aarch64 boards)
    # MongoDB does not publish arm64 packages for Debian bookworm.
    # The Ubuntu 22.04 (jammy) repo does publish arm64 packages and is
    # compatible enough with Debian bookworm to work reliably.
    # Pinned to arch=arm64 so it is silently ignored on amd64 hosts.
    # extras.mongodb-arm64.repo     = "deb [ arch=arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse"
    # extras.mongodb-arm64.key      = "https://pgp.mongodb.com/server-8.0.asc"
    # extras.mongodb-arm64.packages = ["mongodb-org-server"]

    # extras.unifi.repo     = "deb https://www.ui.com/downloads/unifi/debian stable ubiquiti"
    # extras.unifi.key      = "https://dl.ui.com/unifi/unifi-repo.gpg"
    # extras.unifi.packages = ["unifi"]

    # ------------------------------------------------------------------
    # Port named "ui" → available in scripts as $port_ui (not $port).
    # exposed = false: reverse-proxied by nginx, never opened directly.
    # fixed = true: UniFi hard-codes 8443 internally.
    # ------------------------------------------------------------------
    [resources.ports]
    ui.default = 8443
    ui.exposed = false
    ui.fixed   = true

    # ------------------------------------------------------------------
    # Permission named "ui" → init question is init_main_permission.
    # auth_header = false: no SSO header injection in front of UniFi.
    # ------------------------------------------------------------------
    [resources.permissions]
    main.url         = "/"
    main.auth_header = false

    # ------------------------------------------------------------------
    # No [resources.system_user] or [resources.install_dir]:
    # the unifi package manages its own "unifi" system user and writes
    # to /var/lib/unifi, /var/log/unifi, /var/run/unifi itself.
    # ------------------------------------------------------------------
